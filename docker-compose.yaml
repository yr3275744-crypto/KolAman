services:
  broker:
    image: apache/kafka:4.2.2-rc1
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,YY://0.0.0.0:9096,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,YY://broker:9096
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,YY:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 20s
      timeout: 20s
      retries: 8
  rabbit-mq:
    image: rabbitmq:4.3.6-management
    container_name: rabbit-mq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "15672" ]
      interval: 5s
      timeout: 15s
      retries: 3
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
    container_name: elastic
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      # ELASTIC_PASSWORD: example
      xpack.security.enabled: false
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.22
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: "http://elastic:9200"
      # ELASTIC_USER
      # ELASTIC_PASSWORD: example
  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"